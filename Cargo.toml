[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/decision-rs"
repository = "https://github.com/tyrchen/decision-rs"
homepage = "https://github.com/tyrchen/decision-rs"
readme = "README.md"
rust-version = "1.99"

[workspace.dependencies]
# Decision SDK workspace crates
decision-rs = { path = "crates/decision-rs", version = "0.5.0", default-features = false }
decision-macros = { path = "crates/decision-macros", version = "0.5.0" }

# shared third-party dependencies
anyhow = "1.0.104"
darling = "0.24"
futures-util = { version = "0.3.34", default-features = false }
heck = "0.5"
httpdate = "1.0.3"
indexmap = { version = "2.14", features = ["serde"] }
proc-macro2 = "1.0.107"
proptest = "1.11"
quote = "1.0.47"
reqwest = { version = "0.13", default-features = false }
rstest = "0.27"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
syn = { version = "3.0", features = [
  "derive",
  "parsing",
  "printing",
  "clone-impls",
  "proc-macro",
  "extra-traits",
] }
thiserror = "2.0.21"
tokio = "1.53"
tracing = "0.1.44"
tracing-subscriber = "0.3"
trybuild = "1.0"
url = { version = "2.5", features = ["serde"] }
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
