[package]
name = "jev-typed"
description = "Provider-neutral typed decisions for OpenAI, OpenRouter and TypeSafe."
categories = ["asynchronous", "web-programming::http-client", "api-bindings"]
keywords = ["jev", "openai", "llm", "decision", "async"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
## The package is `jev-typed` (crates.io: `jev` and `jev-typed` were both already
## taken by unrelated crates at the time this SDK was written); the library
## itself is still named `jev`, so every `use jev::...` in this workspace's own
## code, and in any downstream consumer, is unaffected by the package rename.
name = "jev"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["derive", "retry", "rustls-tls"]
## Re-exports `#[derive(Decision, ChoiceOptions, ScoreLevels)]` from `jev-macros`.
derive = ["jev-macros"]
## Bounded retry loop honouring `Retry-After`. Deadlines remain active without this feature.
retry = []
## `reqwest` over `rustls` with the `aws-lc-rs` crypto backend (pure Rust).
rustls-tls = ["reqwest/rustls"]
## `decide_all` / `run_cases`, bounded-concurrency helpers over a slice of inputs or
## cases. Pulls in `futures-util`.
batch = ["dep:futures-util"]
## `CaseSet::from_yaml_str` / `CaseSet::from_file` for `.yaml`/`.yml` case files.
## JSON case files need no feature: `serde_json` is always a dependency.
yaml = ["dep:serde-saphyr"]

[dependencies]
futures-util = { workspace = true, optional = true }
httpdate.workspace = true
indexmap.workspace = true
jev-macros = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time", "sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "test-util",
  "net",
] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
trybuild.workspace = true
wiremock.workspace = true

[[example]]
name = "01_single_question"

[[example]]
name = "02_single_typed_choice_and_score"
required-features = ["derive"]

[[example]]
name = "03_multi_question_decision"
required-features = ["derive"]

[[example]]
name = "04_dynamic_questions"

[[example]]
name = "05_thresholds_and_escalation"
required-features = ["derive"]

[[example]]
name = "06_weighted_sampling"
required-features = ["derive"]

[[example]]
name = "07_batch_concurrent"
required-features = ["derive", "batch"]

[[example]]
name = "08_self_hosted_backend"
required-features = ["derive"]

[[example]]
name = "09_cases_from_file"
required-features = ["batch", "yaml"]

[[test]]
name = "derive"
required-features = ["derive"]

[[test]]
name = "live"
required-features = ["derive"]

[[test]]
name = "wire"
required-features = ["derive"]

[lints.rust]
rust_2024_compatibility = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
